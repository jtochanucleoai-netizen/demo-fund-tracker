name: Update fund tracker
on:
  schedule:
    - cron: "50 16 * * 1-5"   # after the European close
    - cron: "25 21 * * 1-5"   # after the US close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Value the fund
        run: python3 scripts/fund_tracker.py
      - name: Publish page and commit track record
        run: |
          cp data/tracker/tracker.html docs/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/tracker/nav.csv data/tracker/entry.json
          git diff --cached --quiet || git commit -m "Tracker update $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push
